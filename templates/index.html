<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACEest Fitness &amp; Gym</title>
    <style>
        :root { --gold: #d4af37; --dark: #1a1a1a; }
        * { box-sizing: border-box; }
        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background: var(--dark);
            color: #fff;
            margin: 0;
            padding: 0;
        }
        header {
            background: var(--gold);
            color: #000;
            padding: 20px;
            text-align: center;
            font-size: 1.6rem;
            font-weight: bold;
            letter-spacing: 1px;
        }
        main { max-width: 700px; margin: 30px auto; padding: 0 20px; }
        form {
            background: #222;
            padding: 20px;
            border-radius: 10px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: flex-end;
        }
        label { display: block; font-size: 0.85rem; margin-bottom: 4px; color: #ccc; }
        input {
            padding: 10px;
            border: none;
            border-radius: 6px;
            background: #333;
            color: #fff;
        }
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            background: var(--gold);
            color: #000;
            font-weight: bold;
            cursor: pointer;
        }
        table { width: 100%; border-collapse: collapse; margin-top: 25px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #333; }
        th { color: var(--gold); }
        .total { margin-top: 20px; font-size: 1.1rem; color: var(--gold); }
        .empty { color: #888; margin-top: 25px; }
    </style>
</head>
<body>
    <header>ACEest Fitness &amp; Gym</header>
    <main>
        <form action="/add_workout" method="post">
            <div>
                <label for="workout">Workout</label>
                <input type="text" id="workout" name="workout" placeholder="e.g. Squats" required>
            </div>
            <div>
                <label for="duration">Duration (min)</label>
                <input type="number" id="duration" name="duration" min="1" placeholder="e.g. 30" required>
            </div>
            <button type="submit">Add Workout</button>
        </form>

        {% if workouts %}
        <table>
            <thead>
                <tr><th>#</th><th>Workout</th><th>Duration (min)</th></tr>
            </thead>
            <tbody>
                {% for item in workouts %}
                <tr>
                    <td>{{ item.id }}</td>
                    <td>{{ item.workout }}</td>
                    <td>{{ item.duration }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
        <p class="total">Total time logged: {{ total }} minutes</p>
        {% else %}
        <p class="empty">No workouts logged yet. Add your first one above!</p>
        {% endif %}
    </main>
</body>
</html>
