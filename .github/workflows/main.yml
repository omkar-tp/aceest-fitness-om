name: ACEest Fitness CI/CD

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Lint with flake8 (syntax errors fail the build)
        run: |
          flake8 app.py tests --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 app.py tests --count --exit-zero --max-line-length=100 --statistics

      - name: Run Pytest
        run: pytest -v

  docker:
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t aceest-fitness:${{ github.sha }} .

      - name: Run tests inside the container
        run: |
          docker run --rm aceest-fitness:${{ github.sha }} \
            sh -c "pip install --no-cache-dir pytest && pytest -v"
